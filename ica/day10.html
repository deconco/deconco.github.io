<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            font-family: sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid chartreuse;
            background-color: pink;
            box-shadow: 1px 1px 2px navy;
            border-radius: 10px;
            padding: 3px 10px;
            cursor: pointer;
            height: 50px;
            width: auto;
            margin: 10px;
        }
    </style>
</head>
<body>
    <button type="button">Player 1: Connor</button>

    <script>
        let x = 1;
        console.log(x);

        const btn = document.querySelector("button");  // picks the first instance of this thing
        btn.addEventListener('click', updateName);

        function updateName() {
            const name = prompt("Enter a new name.");
            btn.textContent = `Player 1: ${name}`; // use back ticks to concatenate
        }
    </script>
  <!--  <script src="../js/day10.js"></script>  put the link to the javascript at the bottom of body-->
</body>
</html>
