<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Start</title>
    <style>

        button {
            cursor: pointer;
        }

        .msgBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 242px;
            background-color: #eee;
        }

        .msgBox p {
            line-height: 1.5;
            padding: 10px 20px;
            color: #333;
            padding-left: 82px;
            background-position: 25px center;
            background-repeat: no-repeat;
        }

        .msgBox button {
            background: none;
            border: none;
            position: absolute;
            top: 0;
            right: 0;
            font-size: 1.1rem;
            color: #aaa;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button>Display message box</button>


    <script>
        // alert("This is a message");

          // edit displayMessage so that it takes no parameters
        const btn = document.querySelector("button").addEventListener('click', displayMessage); // creates the constant and the event listener all in one line
       //  const btn = document.querySelector("button").addEventListener('click', () => displayMessage("What?!", "d3jdken"));
        
        
    
        function displayMessage() {
            const body = document.body;  // grabs the body of the html

                  
            // edit "" when we click the button and run it, it generates two prompts - one for message and one for message type
            let msgText = prompt("Enter your message here.");
            let msgType = prompt("Enter your message type (warning or chat).");
            
            const panel = document.createElement("div"); // makes a div appear on our screen
            panel.setAttribute("class", "msgBox"); // makes panel have a class of msgBox
            body.appendChild(panel);  // adds the panel div as a child to the body

            const msg = document.createElement("p"); // creates a p variable
            // plug the results of user input into the appropriate place
            // msg.textContent = "This is a message box";  what p contains
            msg.textContent = msgText;
            panel.appendChild(msg); // adds msg to panel as a child

            const closeBtn = document.createElement("button");
            closeBtn.textContent = "x";
            panel.appendChild(closeBtn);

            closeBtn.addEventListener("click", () => panel.parentNode.removeChild(panel)); // an anonymous function - only operates here in the function

            if (msgType === "warning") {
                msg.style.backgroundImage = "url(warning.png)";
                panel.style.backgroundColor = "red";
            } 
            else if (msgType === "chat") {
                msg.style.backgroundImage = "url(chat.png)";
                panel.style.backgroundColor = "aqua";
            }
            else {
                msg.style.paddingLeft = "20px";
            }
        }

        // displayMessage();
    </script>
</body>
</html>
