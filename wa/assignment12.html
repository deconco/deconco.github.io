<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/wa12_style.css">
    <title>Document</title>
</head>
<body>
    <div class="app">

        <header>Chuck Norris Content Generator</header>

        <section class="quotes">
          <div class="quote-text" id="js-quote-text"></div>
          <div class="quote-text" id="js-answer-text"></div>
          <div id="cat-image"></div>
        </section>

        <section class="controls" >
          <button type="button" id="js-new-quote" class="new-quote button">
            Generate something about Chuck Norris!
          </button>
          <button type="button" id="js-tweet" class="twitter button">
            Show me a cat to cleanse my soul.
          </button>
          <!-- <a class="answer button" id="js-tweet" target="_blank" rel="noreferrer">Show me the answer!</a> -->
        </section>

      </div>

      <footer>The quote machine now produces Chuck Norris or other cringy nerd related content, and now has a feature
        to produce cat images on demand as well to cleanse your soul after reading. </footer> 
      <script src="../js/wa12.js"></script>
</body>
</html>
