<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Collector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        canvas {
            width: 750px;
            
            position: absolute;
            left: 20%;
            display: block;
        }

        button {
            margin: auto;
            color: black;
            border-radius: 4px;
            border: 5px solid black;
            padding: 10px 20px;
            cursor: pointer;
            text-align: center;
            width: 20%;
            font-size: 20px;
            box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
        }

        #spinb {
            display: block;
            width: 50%;
            background-color: aqua;
            margin-top: 500px;
            transition: background-color, 0.5s;
        }

        #spinb:hover {
            background-color: rgb(0, 190, 190);
        }

        #submit {
            display: block;
            width: 50%;
            background-color: aqua;
        }

        h1 {
            text-align: center;
        }

        div {
            display: flex;
        }


        #wheel.spin {
            animation: spin 2s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Enter your phone number!</h1>
    <canvas id="wheel"></canvas>
    <button id="spinb">SPIN</button>
    <br>

    <div>
        <button id="log_digit">Log Digit</button>
        <button id="del">Delete Last Digit</button>
        <button id="clear">Clear</button>
    </div>
    <br>
    <button id="submit">Submit</button>

    <script>
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const width = (canvas.width = window.innerWidth);
        const height = (canvas.height = window.innerHeight);
        const phoneNumber = "";
        const spin_button = document.querySelector("#spinb");
        const myWheel = document.querySelector("#wheel");

        
        //{
            // make the spinner spin once, and add the number it lands on to the phone number
        //})

        class Slice {
            constructor(x, y, color, size, startAngle, endAngle) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.startAngle = startAngle;
                this.endAngle = endAngle;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, this.startAngle, this.endAngle);
                ctx.fill();
            }
        }
        
        class Picker {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            draw() {
                ctx.beginPath();
                ctx.fillStyle = "black";
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + 70, this.y);
                ctx.lineTo(this.x + 35, this.y + 60);
                ctx.lineTo(this.x, this.y);
                ctx.fill();
            }
        }
        const picker = new Picker(400, 0);

        // initial set up 
        const slice1 = new Slice(375, 370, "red", 350, 0, (Math.PI)/6);
        const slice2 = new Slice(375, 370, "green", 350, (Math.PI)/6, (Math.PI)/3);
        const slice3 = new Slice(375, 370, "blue", 350, (Math.PI)/3, (Math.PI)/2);
        const slice4 = new Slice(375, 370, "yellow", 350, (Math.PI)/2, (2*Math.PI)/3);
        const slice5 = new Slice(375, 370, "purple", 350, (2*Math.PI)/3, (5*Math.PI)/6);
        const slice6 = new Slice(375, 370, "orange", 350, (5*Math.PI)/6, (Math.PI));
        const slice7 = new Slice(375, 370, "black", 350, (Math.PI), (7*Math.PI)/6);
        const slice8 = new Slice(375, 370, "olive", 350, (7*Math.PI)/6, (4*Math.PI)/3);
        const slice9 = new Slice(375, 370, "fuchsia", 350, (4*Math.PI)/3, (3*Math.PI)/2);
        const slice10 = new Slice(375, 370, "maroon", 350, (3*Math.PI)/2, (10*Math.PI)/6);
        const slice11 = new Slice(375, 370, "lime", 350, (10*Math.PI)/6, (11*Math.PI)/6);
        const slice12 = new Slice(375, 370, "aqua", 350, (11*Math.PI)/6, (2*Math.PI));
        slice1.draw();
        slice2.draw();
        slice3.draw();
        slice4.draw();
        slice5.draw();
        slice6.draw();
        slice7.draw();
        slice8.draw();
        slice9.draw();
        slice10.draw();
        slice11.draw();
        slice12.draw();

        let slicesArray = [slice1, slice2, slice3, slice4, slice5, slice6, slice7, slice8, slice9, slice10, slice11, slice12];
        picker.draw();

        /*

            slice.update();
            slice.draw();
            }
            requestAnimationFrame(loop);
        }

        loop();
        */

        spin_button.addEventListener('click', spinWheel);

        function spinWheel () {
            if(myWheel.classList[0] === "spin") {
                myWheel.classList.remove("spin");
                console.log("x");
            }
            myWheel.classList.add("spin");

        }
    </script>
</body>
</html>
