<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Collector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        canvas {
            width: 900px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Enter your phone number!</h1>
    <canvas></canvas>
    <button>SPIN</button>
    <div>
        <button>Log Digit</button>
        <button>Delete Last Digit</button>
        <button>Clear</button>
    </div>
    <button>Submit</button>

    <script>
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const width = (canvas.width = window.innerWidth);
        const height = (canvas.height = window.innerHeight);


        //class Spinner {
        //    constructor(x, y, )
        //}

        class Slice {
            constructor(x, y, color, size, startAngle, endAngle) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.startAngle = startAngle;
                this.endAngle = endAngle;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, this.startAngle, this.endAngle);
                ctx.fill();
            }

        }

        const slice1 = new Slice(900, 500, "red", 350, 0, (Math.PI)/6);
        const slice2 = new Slice(900, 500, "green", 350, (Math.PI)/6, (Math.PI)/3);
        const slice3 = new Slice(900, 500, "blue", 350, (Math.PI)/3, (Math.PI)/2);
        const slice4 = new Slice(900, 500, "yellow", 350, (Math.PI)/2, (2*Math.PI)/3);
        const slice5 = new Slice(900, 500, "purple", 350, (2*Math.PI)/3, (5*Math.PI)/6);
        const slice6 = new Slice(900, 500, "orange", 350, (5*Math.PI)/6, (Math.PI));
        const slice7 = new Slice(900, 500, "black", 350, (Math.PI), (7*Math.PI)/6);
        const slice8 = new Slice(900, 500, "olive", 350, (7*Math.PI)/6, (4*Math.PI)/3);
        const slice9 = new Slice(900, 500, "fuchsia", 350, (4*Math.PI)/3, (3*Math.PI)/2);
        const slice10 = new Slice(900, 500, "maroon", 350, (3*Math.PI)/2, (10*Math.PI)/6);
        const slice11 = new Slice(900, 500, "lime", 350, (10*Math.PI)/6, (11*Math.PI)/6);
        const slice12 = new Slice(900, 500, "aqua", 350, (11*Math.PI)/6, (2*Math.PI));
        slice1.draw();
        slice2.draw();
        slice3.draw();
        slice4.draw();
        slice5.draw();
        slice6.draw();
        slice7.draw();
        slice8.draw();
        slice9.draw();
        slice10.draw();
        slice11.draw();
        slice12.draw();
    </script>
</body>
</html>
