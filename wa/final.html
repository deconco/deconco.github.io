<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Collector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        canvas {
            width: 600px;
            height: auto;
            display: block;
            margin: auto;
        }

        button {
            margin: auto;
            color: black;
            border-radius: 4px;
            border: 5px solid black;
            padding: 10px 20px;
            cursor: pointer;
            text-align: center;
            width: 20%;
            font-size: 20px;
            box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
        }

        #spinb {
            display: block;
            width: 50%;
            background-color: aqua;
            margin-top: 20px;
            transition: background-color, 0.5s;
        }

        #spinb:hover {
            background-color: rgb(0, 190, 190);
        }

        #submit {
            display: block;
            width: 50%;
            background-color: aqua;
        }

        h1 {
            text-align: center;
        }

        div {
            display: flex;
        }


        #wheel.spin {
            animation: spin 2s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Enter your phone number!</h1>
    <canvas id="wheel"></canvas>
    <button id="spinb">SPIN</button>
    <br>

    <div>
        <button id="log_digit">Log Digit</button>
        <button id="del">Delete Last Digit</button>
        <button id="clear">Clear</button>
    </div>
    <br>
    <button id="submit">Submit</button>

        class Slice {
            constructor(x, y, color, size, startAngle, endAngle) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.startAngle = startAngle;
                this.endAngle = endAngle;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, this.startAngle, this.endAngle);
                ctx.fill();
            }
        }

        //picker.draw();

        // draw the wheel!!
        function drawWheel(){
            for (const slice of slicesArray) {
                slice.draw();
            }
        }
            
        drawWheel();

        spin_button.addEventListener('click', randomSpin);

        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        
        
        function turn() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(xcord, ycord);
            ctx.rotate((45 * Math.PI) / 180); 
            ctx.translate(-1 * xcord, -1 * ycord);
            drawWheel();
            

            // turn * 8 = a full spin
        }

        function randomSpin() {
            let spinAmount = random(8, 48);
            while (spinAmount > 0) {
                turn();
                spinAmount--;
                //requestAnimationFrame(randomSpin);
            }
            
        }
