<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Collector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        canvas {
            width: 600px;
            height: auto;
            display: block;
            margin: auto;
        }
        

        #picker_canvas {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 30%;
            right: 30%;

        }

        h2 {
            text-align: center;
        }

        button {
            margin: auto;
            color: black;
            border-radius: 4px;
            border: 5px solid black;
            padding: 10px 20px;
            cursor: pointer;
            text-align: center;
            width: 20%;
            font-size: 20px;
            box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
        }

        #spinb {
            display: block;
            width: 50%;
            background-color: aqua;
            margin-top: 20px;
            transition: background-color, 0.5s;
        }

        #spinb:hover {
            background-color: rgb(0, 190, 190);
        }

        #submit {
            display: block;
            width: 50%;
            background-color: rgb(58, 240, 58);
            transition: background-color, 0.5s;
        }

        #submit:hover {
            background-color: rgb(45, 180, 45);
        }

        h1 {
            text-align: center;
        }

        div {
            display: flex;
        }

        aside {
            background-color: rgb(83, 255, 255);
            width: 200px;
            position: absolute;
            top: 20%;
            right: 5%;
            padding: 10px;
            border-radius: 4px;
            border: 3px solid black;
            box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
        }
        
        #del {
            margin-right: 55px;
        }

        #del:hover {
            background-color: rgb(138, 138, 138);
        }

        #clear {
            margin-left: 55px;
        }

        #clear:hover {
            background-color: rgb(138, 138, 138);
        }

        #here {
            top: 45%;
            text-align: center;
            background-color: green;
        }


    </style>
</head>
<body>
    <h1>Enter your phone number!</h1>
    <canvas id="wheel"></canvas>
    <canvas id="picker_canvas"></canvas>
    <aside>The hotter the slice the higher the number - but watch out for random events!</aside>
    <aside id="here">You are here.</aside>
    <div id="color_dot1"></div>
    <div id="color_dot2"></div>
    <button id="spinb">SPIN</button>
    <h2 id="phone_num">Your number here!</h2>

    <div>
        <button id="del">Delete Last Digit</button>
        <button id="clear">Clear</button>
    </div>
    <br>
    <button id="submit">Submit</button>

    <script>
        const phoneNumber = document.querySelector("#phone_num");
        const canvas = document.querySelector("#wheel");
        const picker_canvas = document.querySelector("#picker_canvas");
        const ctx = canvas.getContext("2d");
        const ctx2 = picker_canvas.getContext("2d"); 
        const width = (canvas.width = window.innerWidth);
        const height = (canvas.height = window.innerHeight);
        const spin_button = document.querySelector("#spinb");
        const del_button = document.querySelector("#del");
        const clear_button = document.querySelector("#clear");
        const submit_button = document.querySelector("#submit");

        // coordinates for the center of the canvas (and wheel)
        var xcord = canvas.width / 2;
        var ycord = canvas.height / 2;


        class Slice {
            constructor(x, y, color, size, startAngle, endAngle, position, action) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.startAngle = startAngle;
                this.endAngle = endAngle;
                this.position = position;
                this.action = action;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, this.startAngle, this.endAngle);
                ctx.fill();
            }
            update() {
                if(this.position === 12) {
                    this.position = 0;
                }
                    this.position++;
            }
        }

        class Picker {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            draw() {
                ctx.beginPath();
                ctx.fillStyle = "black";
                ctx.translate(xcord, ycord);
                ctx.rotate((-15 * Math.PI) / 180);
                ctx.translate(-1 * xcord, -1 * ycord);
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + 90, this.y + 50);
                ctx.lineTo(this.x + 90, this.y - 50);
                ctx.lineTo(this.x, this.y);
                ctx.fill();
            }
        }
       
        let next_action = "";  // a string to hold the event of number currently selected by the wheel
        phone_num = []; // an array to hold the ongoing phone number
        //StringBuilder phone_num = new StringBuilder("");
        
        
        // initial set up 
        const slice1 = new Slice(xcord, ycord, "rgb(255, 206, 0, 1)", 350, 0, (Math.PI)/6, 1, "1");
        const slice2 = new Slice(xcord, ycord, "rgb(255, 191, 0, 1)", 350, (Math.PI)/6, (Math.PI)/3, 2, "2");
        const slice3 = new Slice(xcord, ycord, "rgb(255, 177, 0, 1)", 350, (Math.PI)/3, (Math.PI)/2, 3, "3");
        const slice4 = new Slice(xcord, ycord, "rgb(255, 157, 0, 1)", 350, (Math.PI)/2, (2*Math.PI)/3, 4, "4");
        const slice5 = new Slice(xcord, ycord, "rgb(255, 148, 0, 1)", 350, (2*Math.PI)/3, (5*Math.PI)/6, 5, "action1");
        const slice6 = new Slice(xcord, ycord, "rgb(255, 128, 0, 1)", 350, (5*Math.PI)/6, (Math.PI), 6, "5");
        const slice7 = new Slice(xcord, ycord, "rgb(255, 109, 0, 1)", 350, (Math.PI), (7*Math.PI)/6, 7, "action2");
        const slice8 = new Slice(xcord, ycord, "rgb(255, 85, 0, 1)", 350, (7*Math.PI)/6, (4*Math.PI)/3, 8, "6");
        const slice9 = new Slice(xcord, ycord, "rgb(255, 70, 0, 1)", 350, (4*Math.PI)/3, (3*Math.PI)/2, 9, "7");
        const slice10 = new Slice(xcord, ycord, "rgb(255, 41, 0, 1)", 350, (3*Math.PI)/2, (10*Math.PI)/6, 10, "8");
        const slice11 = new Slice(xcord, ycord, "rgb(255, 0, 0, 1)", 350, (10*Math.PI)/6, (11*Math.PI)/6, 11, "9");
        const slice12 = new Slice(xcord, ycord, "rgb(255, 225, 0, 1)", 350, (11*Math.PI)/6, (2*Math.PI), 12, "0");

        function colorReset() {
            slice12.color = "rgb(255, 225, 0, 1)";
            slice1.color =  "rgb(255, 206, 0, 1)";
            slice2.color =  "rgb(255, 191, 0, 1)";
            slice3.color =  "rgb(255, 177, 0, 1)";
            slice4.color =  "rgb(255, 157, 0, 1)";
            slice5.color =  "rgb(255, 148, 0, 1)";
            slice6.color =  "rgb(255, 128, 0, 1)";
            slice7.color =  "rgb(255, 109, 0, 1)";
            slice8.color =  "rgb(255, 85, 0, 1)";
            slice9.color =  "rgb(255, 70, 0, 1)";
            slice10.color =  "rgb(255, 41, 0, 1)";
            slice11.color =  "rgb(255, 0, 0, 1)";
        }

        let slicesArray = [slice1, slice2, slice3, slice4, slice5, slice6, slice7, slice8, slice9, slice10, slice11, slice12];

        // draw the wheel!!
        function drawWheel(){
            for (const slice of slicesArray) {
                slice.draw();
            }
        }
            
        drawWheel();
        //const picker = new Picker(xcord + (0.55 * xcord), ycord);
        //picker.draw();

        spin_button.addEventListener('click', randomSpin);
        

        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        
        
        function turn() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(xcord, ycord);
            ctx.rotate((30 * Math.PI) / 180); // so each slice has a chance of being in every position
            ctx.translate(-1 * xcord, -1 * ycord);
            drawWheel();
            for(const slice of slicesArray) {
                slice.update();
            }
            

            // turn * 8 = one full spin
        }


        del_button.addEventListener('click', delFunction);
        submit_button.addEventListener('click', checkNumber);
        clear_button.addEventListener('click', clearFunction);

       
        let text = phone_num.toString(); 

        function clearFunction() {
            let i = phone_num.length;
            while (i > 0) {
                phone_num.splice(phone_num.length - 1, 1);
                let text = phone_num.toString();
                text = text.replaceAll(",", "");
                phoneNumber.textContent = text;
                i--;
            }
        }
      

        function delFunction() {
            phone_num.splice(phone_num.length - 1, 1);
            let text = phone_num.toString();
            text = text.replaceAll(",", "");
            phoneNumber.textContent = text;
        
        }

        function checkNumber() {
            if(phone_num.length < 10){
                window.alert("Your number isn't valid.")
            }
            else {
                window.alert("Your phone number has been recorded.");
            }
        }
        //function myFunction2() {
        //    phone_num = phone_num.length;
        //}

        //phoneNumber.textContent = phone_num;

        let spinCounter = 0;
        
        function freeNum() {
            const userIN = prompt("The gods take pity on you every 5 spins. Enter the number you are searching for below.");
            if (userIN === "1" || userIN === "2" || userIN === "3" || userIN === "4" || userIN === "5" || userIN === "6" || userIN === "7" || userIN === "8" || userIN === "9" || userIN === "0") {
                console.log(Number(userIN));
                phone_num.push(Number(userIN));
            }
            else {
                window.alert("You disrespect the magnanimous gods? Your number is wiped.");
                clearFunction();
            }
            return;
        }

        function randomSpin() {
            if(phone_num.length >= 10) {
                // add a pop up alert
                window.alert("10 digits have been reached! Please make edits or submit.");
                return;
            }

            if(spinCounter === 5) {
                freeNum();
                spinCounter = 0;
                let text = phone_num.toString();
                text = text.replaceAll(",", "");
                phoneNumber.textContent = text;
                return;
            }

            colorReset();

            let spinAmount = random(8, 60);
            console.log(spinAmount);
            while (spinAmount > 0) {
                turn();
                
                spinAmount--;
                console.log(spinAmount + "turns left");
            }

            for(const slice of slicesArray) {
                if (slice.position === 1) {
                    next_action = slice.action;
                    slice.color = "green";
                    console.log("action triggered: " + slice.action);
                    drawWheel();
                    
                }
            }

        if (next_action === "0") {
            phone_num.push(0);
        }
        if (next_action === "1") {
            phone_num.push(1);
        }
        if (next_action === "2") {
            phone_num.push(2);
        }
        if (next_action === "3") {
            phone_num.push(3);
        }
        if (next_action === "4") {
            phone_num.push(4);
        }
        if (next_action === "5") {
            phone_num.push(5);
        }
        if (next_action === "6") {
            phone_num.push(6);
        }
        if (next_action === "7") {
            phone_num.push(7);
        }
        if (next_action === "8") {
            phone_num.push(8);
        }
        if (next_action === "9") {
            phone_num.push(9);
        }
        if (next_action === "action1") {
            phone_num.push((random(0, 9)));
            window.alert("Added a random number 0-9!")
        }
        if(next_action === "action2") {
            phone_num.push(phone_num.length);
            window.alert("Added the length of your number!");
        }

        //console.log(phone_num);
        let text = phone_num.toString();
        text = text.replaceAll(",", "");
        phoneNumber.textContent = text;
        
        console.log("spin done");
        console.log(phone_num);
        console.log("number is " + phone_num.length + " digits long");
        spinCounter++;
        return;
        
        }
        //phoneNumber.textContent = phone_num;

    </script>
</body>
</html>
